# HAProxy de la maison — 19/10/2026
# Services PRIVÉS : seulement depuis la maison (192.168.0.0/24) ou le VPN (les clients VPN arrivent via 192.168.0.211).
global
    log /dev/log local0
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 120s
    timeout tunnel 1h

frontend http
    bind :80
    http-request redirect scheme https code 301

frontend https
    bind :443 ssl crt /etc/haproxy/certs/domaine.crt alpn h2,http/1.1
    acl maison src 192.168.0.0/24 10.8.0.0/24
    http-request deny deny_status 403 unless maison
    http-response set-header Strict-Transport-Security "max-age=31536000"
    http-request set-header X-Forwarded-Proto https
    use_backend vaultwarden if { req.hdr(host),field(1,:) -i vault.example.com }
    use_backend wg-easy     if { req.hdr(host),field(1,:) -i wg.example.com }
    default_backend inconnu

backend vaultwarden
    server vw 192.168.0.210:8080 check

backend wg-easy
    server wg 192.168.0.211:51821 check

backend inconnu
    http-request deny deny_status 404
