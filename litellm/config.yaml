# LiteLLM : le standard entre les VM et les IA du Spark.
model_list:
  - model_name: chef            # Qwen3.8-27B : français, plan, relecture
    litellm_params: &chef
      model: openai/chef
      api_base: https://192.168.0.18:8091/chef/v1
      api_key: os.environ/CLE_SPARK
      timeout: 1800
  - model_name: ouvrier         # Qwen3.6-35B-A3B : le code, jusqu'à 32 agents
    litellm_params:
      model: openai/ouvrier
      api_base: https://192.168.0.18:8091/ouvriers/v1
      api_key: os.environ/CLE_SPARK
      timeout: 1800
litellm_settings:
  drop_params: true
  telemetry: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
